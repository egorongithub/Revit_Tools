name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # публикация релизов из job release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ['2020', '2021', '2022', '2024']
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        # Restore выполняется вместе со сборкой в той же конфигурации:
        # от нее зависят TargetFramework (net472 для R2020) и версия
        # NuGet-пакетов Revit API.
        run: msbuild SminexBimTools.sln /restore /p:Configuration="Release R${{ matrix.revit }}" /p:Platform="Any CPU" /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SminexBimTools-Revit${{ matrix.revit }}
          path: |
            src/SminexBimTools/bin/Release R${{ matrix.revit }}/SminexBimTools.dll
            addin/SminexBimTools.addin

  # Публикация релиза: срабатывает при пуше тега вида v1.2.3 —
  # собирает установочные zip по версиям Revit и создает GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack install-ready zips
        run: |
          set -e
          mkdir -p out
          for v in 2020 2021 2022 2024; do
            src="artifacts/SminexBimTools-Revit$v"
            stage="stage/$v"
            mkdir -p "$stage/SminexBimTools"
            cp "$src/addin/SminexBimTools.addin" "$stage/"
            cp "$src/src/SminexBimTools/bin/Release R$v/SminexBimTools.dll" "$stage/SminexBimTools/"
            (cd "$stage" && zip -r "$GITHUB_WORKSPACE/out/SminexBimTools-Revit$v.zip" .)
          done
          ls -la out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sminex BIM Tools $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          Готовые сборки Sminex BIM Tools для Autodesk Revit 2020, 2021, 2022 и 2024.

          **Установка**: распакуйте архив своей версии Revit в
          `%AppData%\Autodesk\Revit\Addins\<версия>\` (внутри архива уже
          правильная структура: `SminexBimTools.addin` + папка
          `SminexBimTools` с DLL) и перезапустите Revit.
          NOTES
          )"
